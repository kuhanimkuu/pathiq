<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed app icon: brand mark on the app background. Safe for maskable
       cropping (the mark stays inside the central 80%). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#00826C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#050D0B"/>
  <rect x="136" y="136" width="240" height="240" rx="68" fill="url(#g)"/>
  <rect x="200" y="200" width="112" height="112" rx="26" fill="#050D0B"/>
</svg>
